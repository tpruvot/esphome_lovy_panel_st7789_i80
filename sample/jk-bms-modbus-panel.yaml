# Tested ok on two types of JK BMS (B1A8S v15 and PB2A16S v19)
#
# To note, the RS485/RJ45 panel of these BMS are not the same (PB2A one come with an extra RS232 RJ11)
# - On the B1A8S with 3 RS485 and a CAN port, use the first one RS485-1...
# - On the PB2A, use the second one, RS485-2.
# The first BMS connection may take a few seconds or minutes, be patient.

substitutions:
  name: jk-bms-modbus-panel-i80
  device_description: "JK-B1A8S-BMS v15 Display Panel via Modbus (RS485-1)"
  rx_pin: GPIO04
  tx_pin: GPIO06 # B A Gnd to RJ45 1 2 3
  flow_control_pin: GPIO05
  wifi_ip: 192.168.0.81 # check wifi section...
  max_cells: 8
  device_addr: "1"    # NOTE: On change also update the first byte in `switch` custom_command and write_lambda
  modbus_fast_update_interval: 10s
  modbus_conf_update_interval: 60s
  modbus_slow_update_interval: 600s

esp32:
  board: esp32-s3-devkitc1-n8r2
  variant: ESP32S3
  flash_size: 8MB
  watchdog_timeout: 30s
  flash_frequency: 40MHZ
  cpu_frequency: 160MHZ
  framework:
    type: esp-idf
    # easy trick to get esp_lcd_panel_io to compile LovyanGFX
    components: [ esp_lcd_panel_io_additions==1.0.1 ]
    advanced:
      flash_chip: generic

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  min_version: "2026.10.0"
  project:
    name: "panel.esphome-jk-bms"
    version: 3.0.0

  includes:
    - lovy_panel_st7789_i80/panel_st7789.hpp
  libraries:
    - LovyanGFX=https://github.com/lovyan03/LovyanGFX@1.2.35

external_components:
  - source:
      type: local
      path: .
    components: [ lovy_panel_st7789_i80 ]

# Display backlight as Gradient Light

globals:
  - id: display_sleep
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: last_backlight_level
    type: uint8_t
    initial_value: "90"

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO47
    frequency: 500Hz
    min_power: 0.01
    max_power: 0.40
    zero_means_zero: true

number:
  - platform: template
    id: backlight_level
    name: "Backlight"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    retain: true
    icon: "mdi:lightbulb-on-outline"
    unit_of_measurement: "%"
    on_value:
      then:
        - lambda: |-
            id(display_sleep) = (x == 0);
            if (x != 0) id(last_backlight_level) = x;
        - output.set_level:
            id: backlight_output
            level: !lambda "return x / 100.0;"

# Panel WT32S3-28S Pro ST7789 (320x240)

lovy_panel_st7789_i80:
  id: display0
  update_interval: 1000ms
  lambda: |-
    if (id(display_sleep) && it->touched) {
      id(display_sleep) = false;
      id(backlight_output).set_level(id(last_backlight_level));
    }

    if (id(display_sleep)) return;

    static lgfx::LGFX_Sprite d(it);
    static bool sprite_ready;
    if (!sprite_ready) {
      // double buffering
      d.createSprite(320, 240);
      sprite_ready = true;
    }

    uint32_t red   = 0x9F0000;
    uint32_t cyan  = 0x007F70;
    uint32_t blue  = 0x00007F;
    uint32_t green = 0x00CF00;
    uint32_t white = 0xCFCFCF;
    uint32_t gray  = 0x6F6F6F;

    d.clear(TFT_BLACK);
    // outline to check dimensions
    //d.drawRect(0, 0, 320, 240, blue);

    // Middle-Center alignment
    d.setTextDatum(MC_DATUM);
    d.setTextSize(2);

    if (isnan(id(state_of_charge).state)) {
      // --- Waiting connection ---
      d.setTextColor(red, TFT_BLACK);
      d.setCursor(80, 30);
      d.printf("Waiting BMS %s", "${device_addr}");

      d.setTextColor(white, TFT_BLACK);
      auto ip = id(wifi_ip).state.c_str();
      if (strlen(ip)) {
        d.setCursor(60, 56);
        d.printf("IP: %s", ip);
      }
    } else {
      // --- Connected ---
      d.setTextSize(3);
      auto soc = id(state_of_charge).get_raw_state();
      d.setTextColor((soc > 50) ? green : (soc > 25) ? TFT_YELLOW : red);
      d.setCursor(20, 30);
      d.printf("%.0f %%", soc);

      d.setTextSize(2);
      d.setTextColor(white);
      d.setCursor(20, 60);
      d.printf("BMS %.1f c", id(mosfet_temperature).state);

      d.setTextColor(white);
      d.setCursor(20, 90);
      d.printf("BAT %.1f c", id(temperature_1).state);

      d.setTextColor(gray);
      d.setCursor(20, 120);
      d.printf("T.2 %.1f c", id(temperature_2).state);

      auto watt = id(total_power).state;
      auto amps = id(current).state;
      auto color = (amps < 0) ? red : green;
      if (amps == 0.) color = gray;

      d.setTextSize(3);
      d.setTextColor(color);
      d.setCursor(20, 180);
      d.printf("%.0f W", abs(watt));

      d.setTextSize(2);
      d.setTextColor(color);
      d.setCursor(20, 210);
      d.printf("%.2f A", abs(amps));

      d.setTextSize(3);
      d.setTextColor(white);
      d.setCursor(200, 30);
      d.printf("%.1f V", id(total_voltage).state);

      d.setTextSize(2);
      d.setTextColor(gray);
      d.setCursor(200, 60);
      d.printf("  %.3f V", id(average_cell_voltage).state);

      d.setTextColor(gray);
      d.setCursor(200, 90);
      d.printf(" ~%.3f V", id(delta_cell_voltage).state);

      if (id(balance_current).state != 0.) {
        d.setTextColor(cyan);
        d.setCursor(200, 120);
        d.printf("Bal %.1f A", abs(id(balance_current).state));
      }
      if (id(alarms_bitmask).state > 0) {
        d.setTextColor(red);
        d.setCursor(200, 150);
        d.printf("! %06x", (uint) id(alarms_bitmask).state);
      }
    }

    // runtime
    if (!isnan(id(total_runtime).state)) {
      d.setTextSize(1);
      d.setCursor(20, 230);
      d.setTextColor(gray);
      d.printf("BMS %s %s", "${device_addr}", id(runtime).state.c_str());
    }

    // --- TOUCHSCREEN ---
    d.drawRect(200, 180, 100, 40, blue);
    d.setTextDatum(MC_DATUM);
    d.setTextSize(2);

    // touch in the button
    if (it->touched && it->tp.x > 200 && it->tp.x < 300 && it->tp.y > 180 && it->tp.y < 220) {
      d.fillRect(200, 180, 100, 40, blue);
      d.setTextColor(TFT_BLACK);
      id(backlight_output).set_level(0);
      id(display_sleep) = true;
    } else {
      d.setTextColor(white);
    }
    d.drawString("Ok", 250, 200);

    // debug touch position
    /*if (it->touched) {
      d.setTextSize(1);
      d.setTextColor(TFT_YELLOW);
      d.setCursor(10, 224);
      d.printf("Touch: X=%d, Y=%d", it->tp.x, it->tp.y);
      it->touched = false;
    }*/

    // Send screen buffer at [0,0]
    it->startWrite();
    d.pushSprite(0, 0);
    it->endWrite();

