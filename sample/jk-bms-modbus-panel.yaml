wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  output_power: 13dB
  manual_ip:
    subnet: 255.255.255.0
    gateway: 192.168.0.254
    dns1: 192.168.0.254
    dns2: 8.8.8.8
    static_ip: ${wifi_ip}
  ap:
    ssid: EASUN_RS485
    password: !secret wifi_ap_password

ota:
  platform: esphome
  encryption:

logger:
  # NOTE: In production this should be INFO or lower to reduce execution time and remove warnings like:
  # [W][component:239]: Component modbus_controller took a long time for an operation (107 ms).
  # [W][component:240]: Components should block for at most 30 ms.
  level: INFO  # DEBUG

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt

api:
  encryption:
    key: !secret esphome_api_key

captive_portal:

web_server:
  version: 2

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_easun_r
  log_topic: null

uart:
  - id: uart_0
    baud_rate: 115200
    rx_buffer_size: 256
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    flow_control_pin: ${flow_control_pin}

modbus_controller:
  - id: bms_fast
    # Dip switch configuration of a single pack setup / address 0x01
    #  1    2    4    5
    #  on, off, off, off (0x01)
    #
    # Don't turn off all dip switches / don't use device address 0x00.
    # This is the Modbus Master mode. You must select a device address
    # between 0x01 and 0x0f so the BMS acts as Modbus Slave.
    address: ${device_addr}
    modbus_id: modbus0
    setup_priority: -10
    update_interval: ${modbus_fast_update_interval}
  - id: bms_conf
    address: ${device_addr}
    modbus_id: modbus0
    setup_priority: -11
    update_interval: ${modbus_conf_update_interval}
  - id: bms_slow
    address: ${device_addr}
    modbus_id: modbus0
    setup_priority: -12
    update_interval: ${modbus_slow_update_interval}

# charging, discharging, and balancing binary_sensors made as the template sensors
# to optimize number of modbus requests
binary_sensor:
  - platform: template
    id: charging
    name: "charging"
    lambda: |-
      return id(charging_raw).state == 1;

  - platform: template
    id: discharging
    name: "discharging"
    lambda: |-
      return id(discharging_raw).state == 1;

  - platform: template
    id: balancing
    name: "balancing"
    lambda: |-
      return id(balancing_raw).state == 1;

  - platform: modbus_controller
    modbus_controller_id: bms_slow
    name: "charging float mode"
    address: 0x1114
    register_type: holding
    bitmask: 0x0200

sensor:
  # 0x1000 0 UINT32 4 RW    VolSmartSleep    mV
  - platform: modbus_controller
    modbus_controller_id: bms_slow
    name: "smart sleep"
    address: 0x1000
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1004 4 UINT32 4 RW    VolCellUV       mV
