text_sensor:
  # - platform: modbus_controller
  #   modbus_controller_id: bms_fast
  #   name: "setup passcode"
  #   register_type: holding
  #   address: 0x1470  # 0x1400 base + 0x0070 offset
  #   response_size: 16
  #   raw_encode: ANSI

  - platform: template
    name: "total runtime formatted"
    id: runtime
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      std::string value = "Unknown";
      if (!isnan(id(total_runtime).state)) {
        uint32_t seconds = (uint32_t) id(total_runtime).state;
        uint32_t years = seconds / (24 * 3600 * 365);
        seconds = seconds % (24 * 3600 * 365);
        uint32_t days = seconds / (24 * 3600);
        seconds = seconds % (24 * 3600);
        uint32_t hours = seconds / 3600;
        value = (years ? to_string(years) + "y " : "") + (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h" : "");
      }
      return value;

  - platform: template
    id: alarms
    name: "alarms"
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      static const uint8_t alarms_size = 22;
      static const char *const alarms[alarms_size] = {
        "Wire resistance",
        "MOS OTP",
        "Cell quantity",
        "Current sensor error",
        "Cell OVP",
        "Battery OVP",
        "Charge OCP",
        "Charge SCP",
        "Charge OTP",
        "Charge UTP",
        "CPU Aux comm error",
        "Cell UVP",
        "Batt UVP",
        "Discharge OCP",
        "Discharge SCP",
        "Discharge OTP",
        "Charge MOS",
        "Discharge MOS",
        "GPS Disconnected",
        "Modify PWD. in time",
        "Discharge On Failed",
        "Battery Over Temp Alarm"
      };
      std::string values = "";
      uint32_t mask = id(alarms_bitmask)->state;
      if (mask) {
        for (int i = 0; i < alarms_size; i++) {
          if (mask & (1 << i)) {
            values.append(alarms[i]);
            values.append("; ");
          }
        }
        if (!values.empty()) {
          values.pop_back();
        }
      }
      return values;

  # Used on display and HA diagnostics
  - platform: wifi_info
    ip_address:
      id: wifi_ip

  - platform: template
    id: esp_ip_address
    name: "WiFi IP address"
    entity_category: diagnostic
    update_interval: 60s
    icon: "mdi:ip-outline"
    lambda: |-
      return id(wifi_ip).state;
