  # 0x12A6   166 UINT8+UINT8 2    R    BalanStatus (2:放电; 1:充电 ; 0:关闭) / SOCStateOfcharge %
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    id: state_of_charge
    name: "state of charge"
    address: 0x12A6
    register_type: holding
    value_type: U_WORD
    state_class: measurement
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    bitmask: 0x00FF

  - platform: modbus_controller
    modbus_controller_id: bms_fast
    id: balancing_raw
    # for compat with JK BMS Card button
    name: "balancer status bitmask"
    icon: "mdi:scale-unbalanced"
    address: 0x12A6
    value_type: U_WORD
    register_type: holding
    state_class: measurement
    accuracy_decimals: 0
    bitmask: 0x0F00

  # 0x12A8   168    INT32    2    R    SOCCapRemain    mAH
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "capacity remaining"
    address: 0x12A8
    register_type: holding
    value_type: U_DWORD
    state_class: measurement
    #device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12AC   172   UINT32    4    R    SOCFullChargeCap    mAH
  - platform: modbus_controller
    modbus_controller_id: bms_slow
    name: "full charge capacity"
    address: 0x12AC
    register_type: holding
    value_type: U_DWORD
    state_class: measurement
    #device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B0   176   UINT32    4    R    SOCCycleCount   次
  - platform: modbus_controller
    modbus_controller_id: bms_slow
    name: "charging cycles"
    address: 0x12B0
    register_type: holding
    value_type: U_DWORD
    state_class: measurement
    accuracy_decimals: 0

  # 0x12B4   180   UINT32    4    R    SOCCycleCap     mAH
  - platform: modbus_controller
    modbus_controller_id: bms_slow
    name: "total charging cycle capacity"
    address: 0x12B4
    register_type: holding
    value_type: U_DWORD
    state_class: measurement
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B8   184 UINT8+UINT8 2    R    StateOfHealth % / Precharge stats (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: bms_slow
    name: "state of health"
    address: 0x12B8
    register_type: holding
    value_type: U_WORD
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return data[item->offset];

  # 0x12BA   186   UINT16    2    R    UserAlarm

  # 0x12BC   188   UINT32    4    R    RunTime         S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "total runtime in seconds"
    address: 0x12BC
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    disabled_by_default: true
    id: total_runtime

  # 0x12C0   192 UINT8+UINT8 Charge (1:打开 ; 0:关闭) / Discharge (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    id: charging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    disabled_by_default: true
    bitmask: 0xFF00

  - platform: modbus_controller
    modbus_controller_id: bms_fast
    id: discharging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    disabled_by_default: true
    bitmask: 0x00FF

  # 0x12C2   194   UINT16    2    R    UserAlarm2
  # - platform: modbus_controller
  #   modbus_controller_id: bms_fast
  #   name: "UserAlarm2 Status"
  #   address: 0x12C2
  #   register_type: holding
  #   value_type: U_WORD
  #   state_class: measurement
  #   accuracy_decimals: 0

  # 0x12C4   196   UINT16    2    R    TimeDcOCPR      S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "discharge OCPR left"
    address: 0x12C4
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12C6   198   UINT16    2    R    TimeDcSCPR      S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "discharge SCPR left"
    address: 0x12C6
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12C8   200   UINT16    2    R    TimeCOCPR       S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "charge OCPR left"
    address: 0x12C8
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CA   202   UINT16    2    R    TimeCSCPR       S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "charge SCPR left"
    address: 0x12CA
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CC   204   UINT16    2    R    TimeUVPR        S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "uVPR left"
    address: 0x12CC
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CE   206   UINT16    2    R    TimeOVPR        S
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "oVPR left"
    address: 0x12CE
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12D0   208 UINT8+UINT8 2    R    AbsentBitmask (Bit0: MOS TempSensorAbsent, Bit1: BATTempSensor1Absent, Bit2: BATTempSensor2Absent, Bit4: BATTempSensor4Absent, Bit5: BATTempSensor5Absent) / Heating
  # 0x12D2   210   UINT16    2    R    Reserved
  # 0x12D4   212   UINT16    2    R    TimeEmergency   S
  # 0x12D6   214   UINT16    2    R    BatCurCorrect
  # 0x12D8   216   UINT16    2    R    VolChargCur     mV
  # 0x12DA   218   UINT16    2    R    VolDischargCur  mV
  # 0x12DC   214   FLOAT     4    R    BatVolCorrect
  # 0x12E4   228   UINT16    2    R    BatVol          0.01V
  # 0x12E6   230   INT16     2    R    HeatCurrent     mA
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "heating current"
    address: 0x12E6
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x12F0   240   UINT32    4    R    SysRunTicks     0.1S

  # 0x12F8   248   INT16     2    R    TempBat 3       0.1℃
  # Sensor 3 is same as Mosfet temperature on PB2A16S20P v19
  #- platform: modbus_controller
