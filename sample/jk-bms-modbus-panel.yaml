  ### 32+2 bytes (Optional Cell Res 16-32 + 00)

  # 0x128A   138    INT16    2    R    TempMos         0.1 °C
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "mosfet temperature"
    id: mosfet_temperature
    address: 0x128A
    # if some cells are commented
    reuse_previous_range: false
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.1

  # 0x128C   140   UINT32    4    R    CellWireResSta  Bit per Cell
  # 0x1290   144   UINT32    4    R    BatVol          mV
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    id: total_voltage
    name: "total voltage"
    address: 0x1290
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1294   148   UINT32    4    R    BatWatt         mW
  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "power"
    id: total_power
    address: 0x1294
    register_type: holding
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - lambda: |-
          return id(current).state < 0
            ? x * -1
            : x;
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "charging power"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x > 0.0f && !isnan(id(total_voltage).state)) {
            return x * id(total_voltage).state;
          }
          return 0.0f;

  - platform: modbus_controller
    modbus_controller_id: bms_fast
    name: "discharging power"
    address: 0x1298
    register_type: holding
    value_type: S_DWORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x < 0.0f && !isnan(id(total_voltage).state)) {
            return abs(x) * id(total_voltage).state;
          }
          return 0.0f;

  # 0x1298   152    INT32    4    R    BatCurrent      mA
  - platform: modbus_controller
    modbus_controller_id: bms_fast
